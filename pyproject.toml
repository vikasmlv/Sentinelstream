[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelstream"
version = "0.1.0"
description = "Real-time fraud risk scoring pipeline: Kafka -> FastAPI/XGBoost -> Redis/DynamoDB"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "xgboost>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.26",
  "redis>=5.0",
  "confluent-kafka>=2.3",
  "boto3>=1.34",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "fakeredis>=2.20", "moto[dynamodb]>=5.0", "scikit-learn>=1.3"]
load = ["locust>=2.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
