# Local stack. NOT verified in the authoring sandbox (no Docker there) - run `docker compose config` first.
x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:29092
  REDIS_URL: redis://redis:6379/0
  DYNAMODB_ENDPOINT: http://dynamodb:8000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  SCORER_URL: http://scorer:8080
  MODEL_PATH: /app/models/model.json
  META_PATH: /app/models/model_meta.json
  TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-6}
  DECISIONS_TABLE: ${DECISIONS_TABLE:-sentinel_decisions}
  DDB_WCU: ${DDB_WCU:-1000}
  DDB_RCU: ${DDB_RCU:-100}
  BATCH_SIZE: ${BATCH_SIZE:-100}
  DDB_WORKERS: ${DDB_WORKERS:-16}
  APPROVE_SAMPLE_RATE: ${APPROVE_SAMPLE_RATE:-1.0}
  XGB_NTHREAD: ${XGB_NTHREAD:-1}
  BATCHER_MAX_SIZE: ${BATCHER_MAX_SIZE:-64}
  BATCHER_MAX_WAIT_MS: ${BATCHER_MAX_WAIT_MS:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RESULTS_DIR: /app/results

services:
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # features are rebuildable from Kafka replay
    ports: ["6379:6379"]

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  init:
    build: .
    command: ["python", "-m", "sentinelstream.admin", "all"]
    environment: *app-env
    depends_on:
      kafka: {condition: service_healthy}
      dynamodb: {condition: service_started}
    restart: "no"

  scorer:
    build: .
    command: ["uvicorn", "sentinelstream.service:app", "--host", "0.0.0.0", "--port", "8080",
              "--workers", "${SCORER_WORKERS:-2}", "--no-access-log"]
    environment: *app-env
    volumes: ["./models:/app/models:ro"]
    ports: ["8080:8080"]

  consumer:
    build: .
    command: ["python", "-m", "sentinelstream.consumer"]
    environment: *app-env
    volumes: ["./results:/app/results"]
    depends_on:
      init: {condition: service_completed_successfully}
      scorer: {condition: service_started}
    # scale with: docker compose up -d --scale consumer=3   (max useful = number of partitions)
